<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMPUS-Mini</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header>
        <h1>SIMPUS-Mini</h1>
    </header>

    <main class="login-wrapper">
        <section>
            <h2 class="text-center">Login Petugas</h2>

            <form action="index.html">
                <p class="text-center text-muted">Silakan masuk menggunakan kredensial Anda.</p>
                
                <div class="mb-3">
                    <label for="username">Username :</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required>
                </div>
                
                <div class="mb-3">
                    <label for="password">Password :</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>
                
                <button type="submit" class="w-100 mt-2">Masuk</button>
            </form>

            <p class="text-center mt-4 mb-0" style="font-size: 0.9rem;">
                Belum punya akun? <a href="#">Daftar di sini</a>
            </p>
        </section>
    </main>

    <footer>
        &copy; 2026 SIMPUS-Mini. Hafizh Arrasyiid Syahbana (254107060026).
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
